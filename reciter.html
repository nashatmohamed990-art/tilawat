<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>القارئ | تلاوات</title>
  <meta name="theme-color" content="#0b1210" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="wrap head">
      <a class="brand" href="index.html"><span>ت</span> تلاوات</a>
      <a class="back" href="index.html">كل القراء</a>
    </div>
  </header>
  <main class="wrap">
    <section class="reciter-hero">
      <p class="kicker" id="rewaya">—</p>
      <h1 id="reciter-name">القارئ</h1>
      <p class="muted" id="reciter-meta"></p>
      <button class="btn" type="button" id="play-all">تشغيل المصحف من الفاتحة</button>
    </section>
    <section>
      <div class="section-head"><h2>السور</h2></div>
      <div id="surah-list" class="surah-list"></div>
    </section>
  </main>
  <footer class="wrap foot">
    <span>تلاوات · استماع للقرآن الكريم</span>
  </footer>
  <div class="dock" id="dock" hidden>
    <strong id="dock-title"></strong>
    <input id="dock-seek" type="range" min="0" max="1000" value="0" aria-label="التقدم" />
    <div class="dock-controls">
      <button type="button" id="dock-list" aria-label="القائمة">☰</button>
      <button type="button" id="dock-prev" aria-label="السابق">⟨⟨</button>
      <button type="button" id="dock-play" aria-label="تشغيل">▶</button>
      <button type="button" id="dock-next" aria-label="التالي">⟩⟩</button>
      <button type="button" id="dock-close" aria-label="إغلاق">×</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
