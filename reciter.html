<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>القارئ | تلاوات القرآن الكريم</title>
  <meta name="theme-color" content="#0a3d32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html">
        <span class="brand-icon">📖</span>
        <span>تلاوات القرآن الكريم</span>
      </a>
      <nav class="nav-desk">
        <a href="index.html">الرئيسية</a>
        <a href="index.html#sheikhs" class="on">المشايخ</a>
        <a href="index.html#about">حول الموقع</a>
      </nav>
      <a class="btn-login" href="index.html" style="text-decoration:none">كل القراء</a>
    </div>
  </header>

  <section class="reciter-hero">
    <p class="kicker" id="rewaya">—</p>
    <h1 id="reciter-name">القارئ</h1>
    <p class="muted" id="reciter-meta"></p>
    <button class="btn-primary" type="button" id="play-all">تشغيل المصحف من الفاتحة</button>
  </section>

  <main class="wrap" style="padding-top:20px">
    <div class="section-head"><h2>فهرس السور</h2></div>
    <div id="surah-list" class="surah-list"></div>
  </main>

  <footer class="foot">
    <p>تلاوات القرآن الكريم · استماع بأصوات المشايخ</p>
  </footer>

  <nav class="bottom-nav">
    <a href="index.html"><span class="ico">🏠</span>الرئيسية</a>
    <a href="index.html#sheikhs" class="on"><span class="ico">🎙️</span>المشايخ</a>
    <a href="index.html#about"><span class="ico">ℹ️</span>حول</a>
  </nav>

  <div class="dock" id="dock" hidden>
    <div class="dock-inner">
      <div class="dock-info">
        <div class="dock-avatar">📖</div>
        <div class="dock-meta">
          <strong id="dock-title">—</strong>
          <span id="dock-sub">—</span>
        </div>
        <button type="button" id="dock-close" class="dock-x">×</button>
      </div>
      <input id="dock-seek" type="range" min="0" max="1000" value="0" />
      <div class="dock-times"><span id="dock-cur">٠:٠٠</span><span id="dock-dur">٠:٠٠</span></div>
      <div class="dock-controls">
        <button type="button" id="dock-list">☰</button>
        <button type="button" id="dock-prev">⟨⟨</button>
        <button type="button" id="dock-play" class="dock-play">▶</button>
        <button type="button" id="dock-next">⟩⟩</button>
        <button type="button" id="dock-repeat">↺</button>
        <button type="button" id="dock-speed">١×</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
