<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>القارئ | تلاوات القرآن الكريم</title>
  <meta name="theme-color" content="#07122a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">ت</span>
        <span>تلاوات القرآن الكريم</span>
      </a>
      <nav class="nav-desk">
        <a href="index.html">الرئيسية</a>
        <a href="index.html#sheikhs" class="on">المشايخ</a>
        <a href="index.html#all">القراء</a>
        <a href="index.html#about">حول</a>
      </nav>
      <a class="btn-login" href="index.html">كل القراء</a>
    </div>
  </header>

  <section class="reciter-hero">
    <p class="kicker" id="rewaya">—</p>
    <h1 id="reciter-name">القارئ</h1>
    <p class="muted" id="reciter-meta"></p>
    <button class="btn-primary" type="button" id="play-all">تشغيل المصحف من الفاتحة</button>
  </section>

  <main class="wrap" style="padding-top:20px">
    <div class="section-head">
      <h2>فهرس سور القرآن الكريم</h2>
      <span class="muted" style="font-size:.82rem">١١٤ سورة</span>
    </div>
    <div id="surah-list" class="surah-grid"></div>
  </main>

  <footer class="foot">
    <p>تلاوات القرآن الكريم</p>
  </footer>

  <nav class="bottom-nav">
    <a href="index.html"><span class="ico">ر</span>الرئيسية</a>
    <a href="index.html#sheikhs" class="on"><span class="ico">ق</span>المشايخ</a>
    <a href="index.html#all"><span class="ico">ك</span>القراء</a>
    <a href="index.html#fav"><span class="ico">م</span>المفضلة</a>
    <a href="index.html#about"><span class="ico">ح</span>حول</a>
  </nav>

  <div class="dock" id="dock" hidden>
    <div class="dock-inner">
      <div class="dock-info">
        <div class="dock-avatar">ق</div>
        <div class="dock-meta">
          <strong id="dock-title">—</strong>
          <span id="dock-sub">—</span>
        </div>
        <button type="button" id="dock-close" class="dock-x" aria-label="إغلاق">×</button>
      </div>
      <input id="dock-seek" type="range" min="0" max="1000" value="0" aria-label="التقدم" />
      <div class="dock-times">
        <span id="dock-cur">٠:٠٠</span>
        <span id="dock-dur">٠:٠٠</span>
      </div>
      <div class="dock-controls">
        <button type="button" id="dock-list" title="القائمة">☰</button>
        <button type="button" id="dock-prev" aria-label="السابق">‹‹</button>
        <button type="button" id="dock-next" aria-label="التالي">››</button>
        <button type="button" id="dock-play" class="dock-play" aria-label="تشغيل">▶</button>
        <button type="button" id="dock-repeat" title="تكرار">↺</button>
        <button type="button" id="dock-speed" title="السرعة">١×</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
