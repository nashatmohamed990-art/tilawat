<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>القارئ | تلاوات</title>
  <meta name="theme-color" content="#0a0b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-reciter">
  <header class="profile-top">
    <a class="pt-btn" href="index.html" aria-label="رجوع">‹</a>
    <div class="pt-actions">
      <button type="button" class="pt-btn" id="btn-share" aria-label="مشاركة">↗</button>
    </div>
  </header>

  <section class="profile-hero">
    <div class="profile-photo" id="reciter-photo"></div>
    <h1 id="reciter-name">القارئ</h1>
    <p class="profile-country" id="reciter-country"><span class="dot"></span> —</p>
    <div class="profile-actions">
      <button type="button" class="pa-btn" id="btn-fav" aria-label="مفضلة">☆</button>
      <button type="button" class="pa-play" id="play-all" aria-label="تشغيل الكل">▶</button>
      <button type="button" class="pa-btn" id="btn-bookmark" aria-label="حفظ">⋯</button>
    </div>
    <p class="profile-bio" id="reciter-bio"></p>
    <div class="profile-stats">
      <span id="reciter-meta">— سورة</span>
    </div>
  </section>

  <main class="profile-list">
    <div id="surah-list" class="surah-rows"></div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><span>الرئيسية</span></a>
    <a href="index.html#sheikhs" class="on"><span>المشايخ</span></a>
    <a href="index.html#all"><span>القراء</span></a>
  </nav>

  <div class="dock" id="dock" hidden>
    <div class="dock-inner">
      <div class="dock-info">
        <div class="dock-meta">
          <strong id="dock-title">—</strong>
          <span id="dock-sub">—</span>
        </div>
        <button type="button" id="dock-close" class="dock-x" aria-label="إغلاق">×</button>
      </div>
      <input id="dock-seek" type="range" min="0" max="1000" value="0" aria-label="التقدم" />
      <div class="dock-times">
        <span id="dock-cur">٠:٠٠</span>
        <span id="dock-dur">٠:٠٠</span>
      </div>
      <div class="dock-controls">
        <button type="button" id="dock-prev" aria-label="السابق">‹</button>
        <button type="button" id="dock-play" class="dock-play" aria-label="تشغيل">▶</button>
        <button type="button" id="dock-next" aria-label="التالي">›</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
