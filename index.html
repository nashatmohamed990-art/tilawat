<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>تلاوات</title>
  <meta name="description" content="تلاوات القرآن الكريم بأصوات القراء" />
  <meta name="theme-color" content="#080f0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="pattern" aria-hidden="true"></div>

  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html">تلاوات</a>
      <form class="top-search" id="search-form" action="#" onsubmit="return false;">
        <input id="q" type="search" placeholder="ابحث عن قارئ…" autocomplete="off" enterkeyhint="search" />
      </form>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <p class="eyebrow">مكتبة صوتية</p>
      <h1>القرآن الكريم</h1>
      <p class="lede">تلاوات مرتّلة، جاهزة للاستماع والحفظ.</p>
    </section>

    <section class="section" id="sheikhs">
      <div class="section-head">
        <h2>قراء مميزون</h2>
        <a class="more" href="#all">عرض الكل</a>
      </div>
      <div class="reciters-row" id="famous-row"></div>
    </section>

    <section class="section section-all" id="all">
      <div class="section-head">
        <h2>كل القراء</h2>
        <span class="count" id="result-count"></span>
      </div>
      <div id="letters" class="letters"></div>
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty" hidden>لا يوجد قارئ بهذا الاسم.</p>
      <p id="loading" class="loading">جارٍ التحميل…</p>
    </section>
  </main>

  <footer class="foot">
    <p>تلاوات · الصوت من مصادر عامة</p>
  </footer>

  <nav class="bottom-nav" aria-label="التنقل">
    <a href="index.html" class="on">الرئيسية</a>
    <a href="#sheikhs">المشايخ</a>
    <a href="#all">القراء</a>
  </nav>

  <div class="dock" id="dock" hidden>
    <div class="dock-inner">
      <div class="dock-info">
        <div class="dock-meta">
          <strong id="dock-title">—</strong>
          <span id="dock-sub">—</span>
        </div>
        <button type="button" id="dock-close" class="dock-x" aria-label="إغلاق">×</button>
      </div>
      <input id="dock-seek" type="range" min="0" max="1000" value="0" aria-label="التقدم" />
      <div class="dock-times">
        <span id="dock-cur">٠:٠٠</span>
        <span id="dock-dur">٠:٠٠</span>
      </div>
      <div class="dock-controls">
        <button type="button" id="dock-dl" aria-label="تنزيل" title="تنزيل">↓</button>
        <button type="button" id="dock-prev" aria-label="السابق">‹</button>
        <button type="button" id="dock-play" class="dock-play" aria-label="تشغيل">▶</button>
        <button type="button" id="dock-next" aria-label="التالي">›</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
