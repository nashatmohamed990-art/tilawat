<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تلاوات | القرآن الكريم بأصوات القراء</title>
  <meta name="description" content="استمع للقرآن الكريم بصوت أشهر القراء" />
  <meta name="theme-color" content="#0b1210" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="wrap head">
      <a class="brand" href="index.html"><span>ت</span> تلاوات</a>
      <div class="search-box">
        <input id="q" type="search" placeholder="ابحث عن قارئ…" autocomplete="off" />
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <p class="kicker">القرآن الكريم</p>
      <h1>استمع بأصوات القراء</h1>
      <p class="lede">أكثر من مئتي قارئ، مصاحف كاملة مرتلة، تشغيل مباشر دون تحميل.</p>
      <div class="stats">
        <div><b id="stat-count">—</b><span>قارئ</span></div>
        <div><b>١١٤</b><span>سورة</span></div>
        <div><b>مجاني</b><span>بدون تسجيل</span></div>
      </div>
    </section>
    <section>
      <div class="section-head">
        <h2>القراء</h2>
        <p class="muted" id="result-count"></p>
      </div>
      <div id="letters" class="letters"></div>
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty" hidden>لا يوجد قارئ بهذا الاسم.</p>
    </section>
  </main>
  <footer class="wrap foot">
    <span>تلاوات · استماع للقرآن الكريم</span>
    <span>الصوت من مصادر عامة · للاستخدام الشخصي</span>
  </footer>
  <div class="dock" id="dock" hidden>
    <strong id="dock-title"></strong>
    <input id="dock-seek" type="range" min="0" max="1000" value="0" aria-label="التقدم" />
    <div class="dock-controls">
      <button type="button" id="dock-list" aria-label="القائمة">☰</button>
      <button type="button" id="dock-prev" aria-label="السابق">⟨⟨</button>
      <button type="button" id="dock-play" aria-label="تشغيل">▶</button>
      <button type="button" id="dock-next" aria-label="التالي">⟩⟩</button>
      <button type="button" id="dock-close" aria-label="إغلاق">×</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
